[package]
name = "wasm_raytracing"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm-bindgen = "0.2.122"

[lib]
crate-type = ["cdylib", "rlib"]
path = "./src/lib/rust/lib.rs"

[profile.dev]
opt-level = 3
lto = true
codegen-units = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1